[brain]
vault = "memory"
agent_dir = "agent"
people_dir = "people"
agents_dir = "agents"
human_profile = "human/Profile.md"
sources_dir = "sources"
runtime_dir = "Runtime"   # schedule, skills and engine state under the vault folder
human_name = "Human"
agent_name = "Agent"
skill_prefix = "brain-"
timezone = "America/Los_Angeles"   # the owner's zone, not the host's
update_source = "git+https://github.com/RoshuAmir918/agent-brain"   # "" disables the nightly auto-update
owner_user_ids = []   # your own permanent platform ids, e.g. "<platform>:<permanent id>" (a bare id matches any platform); the harness resolves these sessions as the owner
log_dirs = []   # folders under agent_dir holding receipts, ledgers or results; records, never notes
