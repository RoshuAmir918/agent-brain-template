[brain]
vault = "memory"
agent_dir = "agent"
people_dir = "people"
agents_dir = "agents"
human_profile = "human/Profile.md"
sources_dir = "sources"
hermes_dir = "hermes"
human_name = "Human"
agent_name = "Agent"
skill_prefix = "brain-"
timezone = "America/Los_Angeles"   # the owner's zone, not the host's
update_source = "git+https://github.com/RoshuAmir918/agent-brain"   # "" disables the nightly auto-update
owner_user_ids = []   # your own permanent platform ids, e.g. "demiurge:<permanent id>" (a bare id matches any platform); the provider treats these sessions as the owner
log_dirs = []   # folders under agent_dir holding receipts, ledgers or results; records, never notes
maintainers = []   # permanent platform ids, same form, of whoever keeps this brain running without owning it; they get the health report, never the owner's context
